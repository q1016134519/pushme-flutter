name: Build PushMe APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: |
          flutter --version
          java -version

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install NDK and CMake
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "ndk;28.2.13676358" "cmake;3.22.1" || true
          fi

      - name: Pub get
        run: flutter pub get

      # ---- 1. 按 ABI 分别打包（每个 APK 只含一种架构，体积最小）----
      - name: Build per-ABI APKs
        run: |
          flutter build apk --release --no-pub --split-per-abi \
            --target-platform android-arm,android-arm64,android-x64

      - name: Collect per-ABI APKs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/PushMe-5.1.0-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   dist/PushMe-5.1.0-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      dist/PushMe-5.1.0-x86_64.apk
          ls -lh dist

      # ---- 2. 全 ABI 并存版（一个 APK 内含三种架构，体积大但通用）----
      - name: Build universal APK
        run: |
          flutter build apk --release --no-pub \
            --target-platform android-arm,android-arm64,android-x64
          cp build/app/outputs/flutter-apk/app-release.apk dist/PushMe-5.1.0-universal.apk
          ls -lh dist

      - name: Show final list
        run: |
          echo "=== 产物清单 ==="
          ls -lh dist
          for f in dist/*.apk; do
            echo "--- $f ---"
            unzip -l "$f" | grep -E "lib/.*\.so" | awk '{print $4}' | cut -d/ -f2 | sort -u || true
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: PushMe-Flutter-5.1.0-all-abis
          path: dist/*.apk
          if-no-files-found: error
